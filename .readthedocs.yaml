# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  jobs:
    create_environment:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - $HOME/.local/bin/uv sync --extra docs --no-dev
    build:
      html:
        - $HOME/.local/bin/uv run --no-sync sphinx-build -W --keep-going -b html docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
