[project]
name = "occhio"
version = "0.2.3"
description = "Experiment with Toy Models of Superposition"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10.0",
    "numpy>=1.26",
    "ipykernel>=7.2.0",
    "plotly>=6.6.0",
    "nbformat>=5.10.4",
    "einops>=0.8.2",
    "jupyterlab>=4.5.3",
    "debugpy>=1.8.20",
    "scipy>=1.15.3",
    "tqdm>=4.67.3",
    "ipython>=8.38.0",
    "sae-lens>=6.38.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.36.2",
    "dill>=0.4.0",
    "pandas>=2.3.3",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "jupyter>=1.1.1",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.8",
    "mkdocs>=1.6.1",
    "nbformat>=5.10.4",
    "nbstripout>=0.9.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "ruff-jupyter-jetbrains>=1.0.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "ty>=0.0.14",
    "graphviz>=0.21",
    "huggingface-hub[cli]>=0.36.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"


# For read the docs deployment with pip
[project.optional-dependencies]
docs = [
    "sphinx>=8.1.3",
    "myst-parser>=4.0.1",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-notfound-page>=1.1.0",
    "sphinx-llm>=0.3.0",
]
